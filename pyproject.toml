[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-studio"
version = "0.1.0"
description = "Multi-purpose computer vision metrology platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Youssef", email = "youssef@example.com" }
]
dependencies = [
    "flask>=3.0",
    "flask-cors>=4.0",
    "PyJWT>=2.8",
    "pydantic>=2.0",
    "dependency-injector>=4.41",
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "scipy>=1.12",
    "kaggle>=1.6.14",
    "pymongo>=4.0",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.2",
    "torchvision>=0.17",
    "ultralytics>=8.2",
    "onnxruntime-gpu>=1.17",
]
cameras = [
    "harvesters>=1.4",
    "aiortc>=1.9",
    "av>=12.0",
]
azure = [
    "azure-storage-blob>=12.19",
    "azure-identity>=1.15",
    "azure-keyvault-secrets>=4.8",
    "azure-ai-ml>=1.15",
]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
test = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "factory-boy>=3.3",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["vision_studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

