domain_name: "chignon_inspection"
model_type: "unet"
model_weights_path: "chignon_segmentation.pt"
camera_protocol: "mindvision"

classes:
  - id: 0
    name: "chignon_base"
    color: [255, 255, 0]
    family: "base"
  - id: 1
    name: "defect"
    color: [255, 0, 0]
    family: "defect"

tolerances:
  defect:
    nominal: 0.0
    lower: 0.0
    upper: 5.0  # Max allowed defect area
    unit: "mm2"
