domain_name: "stator_inspection"
model_type: "yolo"
model_weights_path: "stator_best.pt"
camera_protocol: "uvc"

classes:
  - id: 0
    name: "stator_outer"
    color: [0, 255, 0]
    family: "stator"
  - id: 1
    name: "stator_inner"
    color: [255, 0, 0]
    family: "stator"
  - id: 2
    name: "magnet"
    color: [0, 0, 255]
    family: "component"

tolerances:
  stator_outer:
    nominal: 120.0
    lower: 119.5
    upper: 120.5
    unit: "mm"
  stator_inner:
    nominal: 80.0
    lower: 79.5
    upper: 80.5
    unit: "mm"
