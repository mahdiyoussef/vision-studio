apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vision-studio.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "vision-studio.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "vision-studio.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "vision-studio.name" . }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          env:
            - name: MONGO_URI
              value: {{ .Values.env.MONGO_URI | quote }}
